<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" /> 
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LearnMQL5 – Trading Bots & Courses</title>
    <meta name="description" content="Premium trading bots built for MQL5 and expert-led courses to help you automate profitable strategies." />
    <script>
      (function () {
        try { 
          var stored = localStorage.getItem('lm-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
